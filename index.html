<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/confige.css" />
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- fonts -->
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- font awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <title>age-calculator-app-main</title>
  </head>
  <body class="bg-[#f0f0f0] flex justify-center items-center h-dvh">
    <div
      class="container w-[55%] py-10 px-8 rounded-2xl h-[70%] bg-[#ffffff] rounded-br-[125px]"
    >
      <div class="inputs flex gap-7">
        <div class="flex flex-col w-[20%]">
          <label class="ml-2 mb-1 text-[#717171] font-bold uppercase" for="day"
            >day</label
          >
          <input
            class="border-2 text-2xl uppercase font-bold pl-3 border-[#8b8b8b] rounded-md py-3 focus:outline-[#864cff]"
            id="day"
            placeholder="dd"
            type="number"
            min="1"
          />
          <span id="span-input" class="text-red-500 text-[13px] w-dvw"></span>
        </div>
        <div class="flex flex-col w-[20%]">
          <label
            class="ml-2 mb-1 text-[#717171] font-bold uppercase"
            for="month"
            >month</label
          >
          <input
            class="border-2 text-2xl uppercase font-bold pl-3 border-[#8b8b8b] rounded-md py-3 focus:outline-[#864cff]"
            id="month"
            placeholder="MM"
            type="number"
            min="1"
          />
          <span id="span-input" class="text-red-500 text-[13px] w-dvw"></span>
        </div>
        <div class="flex flex-col w-[20%]">
          <label class="ml-2 mb-1 text-[#717171] font-bold uppercase" for="year"
            >year</label
          >
          <input
            class="border-2 text-2xl uppercase font-bold pl-3 border-[#8b8b8b] rounded-md py-3 focus:outline-[#864cff]"
            id="year"
            placeholder="YYYY"
            type="number"
            min="1"
          />
          <span id="span-input" class="text-red-500 text-[13px] w-dvw"></span>
        </div>
      </div>
      <div class="divider flex relative mt-2 items-center gap-0.5">
        <hr class="bg-red-900 h-1 w-[85%]" />
        <button
          id="btn-calculate"
          class="bg-[#864cff] hover:bg-[#151515] duration-700 transition rounded-full p-3.5"
        >
          <img src="/images/icon-arrow.svg" alt="" />
        </button>
      </div>
      <div>
        <div class="flex items-center gap-3">
          <div id="year-spans" class="flex gap-3">
            <span class="w-16 h-3 bg-[#844dff]"></span>
            <span class="w-16 h-3 bg-[#844dff]"></span>
          </div>
          <h1 class="text-7xl font-bold italic text-[#151515]">years</h1>
        </div>
        <div class="flex items-center gap-3">
          <div id="month-spans" class="flex gap-3">
            <span class="w-16 h-3 bg-[#844dff]"></span>
            <span class="w-16 h-3 bg-[#844dff]"></span>
          </div>
          <h1 class="text-7xl font-bold italic text-[#151515]">months</h1>
        </div>
        <div class="flex items-center gap-3">
          <div id="day-spans" class="flex gap-3">
            <span class="w-16 h-3 bg-[#844dff]"></span>
            <span class="w-16 h-3 bg-[#844dff]"></span>
          </div>
          <h1 class="text-7xl font-bold italic text-[#151515]">days</h1>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
